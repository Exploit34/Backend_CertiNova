<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Solicitud enviada</title>

    <style>

        body{

            background:#020617;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;

        }

        .card{

            background:#111827;
            padding:40px;
            border-radius:20px;
            width:500px;
            text-align:center;

        }

        h1{

            color:#00ffcc;

        }

        .btn_volver{

            background:#00ffcc;
            color:#111827;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
            margin-top:20px;

        }

    </style>

</head>

<body>

    <div class="card">

        <h1>❌ Solicitud fallida</h1>

        <p>El correo electrónico ya está registrado.</p>

        <button class="btn_volver" onclick="window.location.href='/'">Volver al inicio</button>

    </div>

</body>

</html>
